stock_universe:
  - AAPL
  - MSFT
  - AMZN
  - GOOGL
  - META
start_date: "2000-01-01"
end_date: "2026-06-17"
fred_series:
  - DGS10
  - DGS2
  - VIXCLS
  - GDP
  - BAMLH0A0HYM2
  - NAPM
rebuild_on_run: false
download:
  max_workers: 4
  retries: 3
  retry_delay_seconds: 2
  batch_size: 25
universe_filter:
  min_market_cap_bn: 1.0          # exclude stocks with dollar-vol proxy < $1B
  min_dollar_vol_percentile: 50   # exclude stocks below median daily dollar volume
  ipo_exclusion_months: 12        # exclude stocks within 12 months of first price date
  dollar_vol_lookback_days: 60    # trailing window for avg daily dollar volume
week2:
  return_frequency: monthly
  return_column: simple_return
  gap_fill_method: none
  max_consecutive_missing: 5
  artifact_dir: data/processed/week2
  save_artifacts: true
logging:
  level: INFO
  file: logs/pipeline.log

week3:
  momentum_lookback_months: 12
  short_momentum_lookback_months: 3
  volatility_lookback_days: 252
  winsorize_limits: [0.01, 0.01]  # winsorize limits [left_pct, right_pct]
  neutralize_size: true
  neutralize_sector: true
  save_artifacts: true
  artifact_dir: data/processed/week3

