stock_universe:
  - AAPL
  - MSFT
  - AMZN
  - GOOGL
  - META
start_date: "2000-01-01"
end_date: "2026-06-17"
fred_series:
  - DGS10
  - DGS2
  - VIXCLS
  - GDP
  - BAMLH0A0HYM2
  - NAPM
rebuild_on_run: false
download:
  max_workers: 4
  retries: 3
  retry_delay_seconds: 2
  batch_size: 25
universe_filter:
  min_market_cap_bn: 1.0          # exclude stocks with dollar-vol proxy < $1B
  min_dollar_vol_percentile: 50   # exclude stocks below median daily dollar volume
  ipo_exclusion_months: 12        # exclude stocks within 12 months of first price date
  dollar_vol_lookback_days: 60    # trailing window for avg daily dollar volume
week2:
  return_frequency: monthly
  return_column: simple_return
  gap_fill_method: none
  max_consecutive_missing: 5
  artifact_dir: data/processed/week2
  save_artifacts: true
logging:
  level: INFO
  file: logs/pipeline.log

week3:
  momentum_lookback_months: 12
  short_momentum_lookback_months: 3
  volatility_lookback_days: 252
  winsorize_limits: [0.01, 0.01]  # winsorize limits [left_pct, right_pct]
  neutralize_size: true
  neutralize_sector: true
  save_artifacts: true
  artifact_dir: data/processed/week3

week5:
  rebalance_frequency: monthly
  initial_capital: 10000000.0
  weighting_method: equal_weight_long_only
  max_position_size: 0.05
  commission_bps: 5.0
  bid_ask_spread_bps: 10.0
  long_only: true
  net_exposure: 1.0
  gross_exposure: 1.0
  save_artifacts: true
  artifact_dir: data/processed/week5

week6:
  combination_methods: [ic_weighted, fama_macbeth, xgboost]
  xgb_n_estimators: 200
  xgb_max_depth: 4
  xgb_learning_rate: 0.05
  xgb_min_train_months: 36
  xgb_purge_gap_months: 1
  ic_lookback_months: 36
  oos_start_date: "2010-01-01"
  save_artifacts: true
  artifact_dir: data/processed/week6

week7:
  n_components: 4
  covariance_type: "full"
  n_iter: 100
  random_state: 42
  bic_selection: true
  max_bic_components: 6
  save_artifacts: true
  artifact_dir: data/processed/week7

week8:
  ic_lookback_months: 36
  decay_halflife: 12
  prior_weight: 0.3
  min_regime_samples: 10
  max_factor_weight: 0.25
  min_weight_threshold: 0.02
  oos_start_date: "2010-01-01"
  oos_end_date: "2024-12-31"
  save_artifacts: true
  artifact_dir: data/processed/week8

week9:
  covariance_model: ledoit_wolf
  optimizer_type: cvar
  alpha_confidence: 0.95
  target_cvar: 0.20
  max_position_size: 0.05
  max_sector_exposure: 0.20
  tc_penalty_lambda: 1.0
  solver_chain: ["CLARABEL", "OSQP", "ECOS"]
  cov_lookback_days: 252
  regularization_eps: 0.000001
  save_artifacts: true
  artifact_dir: data/processed/week9

week10:
  api_title: "Regime-Adaptive Multi-Factor Alpha Engine API"
  api_version: "1.0.0"
  cache_ttl_seconds: 86400
  scheduler_cron: "30 16 * * 1-5"
  timezone: "America/New_York"


